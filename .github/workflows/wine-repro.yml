name: Wine repro (diagnostic, fork only)

# Throwaway diagnostic workflow: reproduces the wine+rcedit step that
# electron-builder runs for the Windows target inside the same container image,
# on both runner images, and tries an ASLR-disabled variant.
# Fork only — never merge.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  wine:
    name: wine+rcedit on ${{ matrix.image }}
    strategy:
      fail-fast: false
      matrix:
        image: [ubuntu-24.04, ubuntu-26.04]
    runs-on: ${{ matrix.image }}
    timeout-minutes: 20
    container:
      image: electronuserland/builder:wine
    env:
      HOME: /tmp/electron-home
      DEBUG: electron-builder

    steps:
      - uses: actions/checkout@v4

      - name: Environment info
        run: |
          mkdir -p "$HOME"
          echo "runner image label : ${{ matrix.image }}"
          uname -a
          cat /proc/version
          echo "PAGESIZE=$(getconf PAGESIZE)"
          echo "--- ASLR / mmap knobs"
          for f in /proc/sys/kernel/randomize_va_space /proc/sys/vm/mmap_rnd_bits /proc/sys/vm/mmap_rnd_compat_bits; do
            printf '%s = ' "$f"; cat "$f" 2>/dev/null || echo "(unreadable)"
          done
          echo "--- /dev/shm"
          df -h /dev/shm || true
          echo "--- node / npm / wine"
          node -v
          npm -v
          command -v wine || true
          wine --version || true

      - name: Install node modules (scripts disabled, no electron download)
        run: cd pyinstaller/electron && npm ci --ignore-scripts

      - name: Download winCodeSign (no wine involved)
        run: |
          cd pyinstaller/electron
          AB="$PWD/node_modules/app-builder-bin/linux/x64/app-builder"
          SZA="$PWD/node_modules/7zip-bin/linux/x64/7za"
          chmod +x "$AB" "$SZA"
          export SZA_PATH="$SZA"
          time timeout 120 "$AB" download-artifact \
            --name winCodeSign-2.6.0 \
            --url https://github.com/electron-userland/electron-builder-binaries/releases/download/winCodeSign-2.6.0/winCodeSign-2.6.0.7z
          ls "$HOME/.cache/electron-builder/winCodeSign/winCodeSign-2.6.0" | head

      - name: wine+rcedit, default ASLR (120s limit)
        run: |
          set +e
          cd pyinstaller/electron
          AB="$PWD/node_modules/app-builder-bin/linux/x64/app-builder"
          export SZA_PATH="$PWD/node_modules/7zip-bin/linux/x64/7za"
          V="$HOME/.cache/electron-builder/winCodeSign/winCodeSign-2.6.0"
          cp "$V/rcedit-x64.exe" /tmp/t1.exe
          echo "=== START $(date -u +%H:%M:%SZ)"
          timeout 120 "$AB" wine --ia32 "$V/rcedit-ia32.exe" --x64 "$V/rcedit-x64.exe" \
            --args '["/tmp/t1.exe","--set-version-string","ProductName","Specter"]'
          echo "=== EXIT=$? $(date -u +%H:%M:%SZ)"
          wineserver -k 2>/dev/null || true
          pkill -f wineserver 2>/dev/null || true

      - name: wine+rcedit with ASLR disabled (120s limit)
        run: |
          set +e
          cd pyinstaller/electron
          AB="$PWD/node_modules/app-builder-bin/linux/x64/app-builder"
          export SZA_PATH="$PWD/node_modules/7zip-bin/linux/x64/7za"
          V="$HOME/.cache/electron-builder/winCodeSign/winCodeSign-2.6.0"
          cp "$V/rcedit-x64.exe" /tmp/t2.exe
          # PATH shim: make every "wine" invocation run under setarch -R
          mkdir -p /tmp/shim
          cat > /tmp/shim/wine <<'SH'
          #!/bin/sh
          exec setarch "$(uname -m)" -R "$(command -v /opt/wine-stable/bin/wine)" "$@"
          SH
          chmod +x /tmp/shim/wine
          export PATH="/tmp/shim:$PATH"
          echo "shim wine -> $(command -v wine)"
          echo "=== START $(date -u +%H:%M:%SZ)"
          timeout 120 "$AB" wine --ia32 "$V/rcedit-ia32.exe" --x64 "$V/rcedit-x64.exe" \
            --args '["/tmp/t2.exe","--set-version-string","ProductName","Specter"]'
          echo "=== EXIT=$? $(date -u +%H:%M:%SZ)"
          ls -la /tmp/t2.exe

      - name: Hang diagnostics
        if: always()
        run: |
          echo "=== processes"
          ps -eo pid,ppid,stat,etime,wchan:32,args | grep -iE "wine|rcedit|app-builder|wineserver" | grep -v grep || echo "(none)"
          echo "=== dmesg tail"
          dmesg 2>/dev/null | tail -20 || echo "(dmesg not permitted)"
